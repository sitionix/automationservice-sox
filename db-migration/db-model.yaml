database:
  name: atms_sox
  environments:
    dev:
      url: jdbc:postgresql://127.0.0.1:15436/atms_sox
      username: atmssox_app
      password_secret_name: ATMS_SOX_DB_PASSWORD
      tunnel:
        local_port: 15436
        remote_host: 127.0.0.1
        remote_port: 5432

tables:
  agent_statuses:
    columns:
      id: bigint
      description: varchar(64)
  agent_rule_statuses:
    columns:
      id: bigint
      description: varchar(64)
  agent_rule_author_types:
    columns:
      id: bigint
      description: varchar(64)
  agent_types:
    columns:
      id: bigint
      description: varchar(64)
  agents:
    columns:
      agent_id: uuid
      user_id: bigint
      name: varchar(60)
      description: varchar(160)
      instruction: text
      type_id: bigint
      status_id: bigint
      created_at: timestamptz
      updated_at: timestamptz
  agent_projects:
    columns:
      project_id: uuid
      owner_user_id: bigint
      name: varchar(120)
      description: text
      status_id: bigint
      created_at: timestamptz
      updated_at: timestamptz
  agent_project_statuses:
    columns:
      id: bigint
      description: varchar(64)
  agent_rules:
    columns:
      rule_id: uuid
      agent_id: uuid
      title: varchar(255)
      content: text
      status_id: bigint
      author_type_id: bigint
      created_at: timestamptz
      updated_at: timestamptz
  conversations:
    columns:
      conversation_id: uuid
      user_id: bigint
      title: varchar(80)
      type: varchar(32)
      status: varchar(32)
      created_at: timestamptz
      updated_at: timestamptz
      last_message_at: timestamptz
  conversation_participants:
    columns:
      participant_id: uuid
      conversation_id: uuid
      participant_type: varchar(32)
      participant_ref: varchar(64)
      joined_at: timestamptz
  conversation_messages:
    columns:
      message_id: uuid
      conversation_id: uuid
      author_type: varchar(32)
      author_id: varchar(64)
      content: text
      created_at: timestamptz
  conversation_context_snapshots:
    columns:
      id: uuid
      conversation_id: uuid
      summary: text
      message_count_until: integer
      last_message_id_until: uuid
      created_at: timestamptz
      updated_at: timestamptz
  chat_executions:
    columns:
      execution_id: uuid
      agent_id: uuid
      conversation_id: uuid
      user_id: bigint
      status_id: bigint
      request_message: text
      idempotency_key: varchar(255)
      input_message_id: uuid
      assistant_message_id: uuid
      failure_class_id: bigint
      failure_reason: text
      failure_retryable: boolean
      created_at: timestamptz
      started_at: timestamptz
      completed_at: timestamptz
  chat_execution_statuses:
    columns:
      id: bigint
      description: varchar(64)
  chat_execution_failure_classes:
    columns:
      id: bigint
      description: varchar(64)
