name: Service Deploy On Push

on:
  push:
    branches:
      - develop
    paths:
      - ".github/workflows/service-deploy-on-push.yml"
      - ".github/actions/db-migrate-run/**"
      - ".github/actions/service-deploy-run/**"
      - ".github/actions/materialize-maven-settings/**"
      - "db-migration/**"
      - ".github/deploy/service/**"
      - "boot/**"
      - "api-rest/**"
      - "application/**"
      - "domain/**"
      - "infrastructure/**"
      - "pipe/**"
      - "Dockerfile"
      - "pom.xml"
      - "docs/**"
  workflow_dispatch:
    inputs:
      environment_id:
        description: GitHub Environment id to deploy. Falls back to PUSH_DEPLOY_ENVIRONMENT_ID when omitted.
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-deploy-target:
    runs-on: ubuntu-latest
    outputs:
      environment_id: ${{ steps.resolve.outputs.environment_id }}
    steps:
      - name: Resolve deploy environment
        id: resolve
        shell: bash
        env:
          INPUT_ENVIRONMENT_ID: ${{ github.event.inputs.environment_id }}
          PUSH_ENVIRONMENT_ID: ${{ vars.PUSH_DEPLOY_ENVIRONMENT_ID }}
        run: |
          environment_id="${INPUT_ENVIRONMENT_ID:-}"
          if [[ -z "${environment_id}" ]]; then
            environment_id="${PUSH_ENVIRONMENT_ID:-}"
          fi
          if [[ -z "${environment_id}" ]]; then
            echo "Missing deployment environment. Set PUSH_DEPLOY_ENVIRONMENT_ID or provide workflow_dispatch environment_id." >&2
            exit 1
          fi
          if [[ ! "${environment_id}" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "Invalid deployment environment: ${environment_id}" >&2
            exit 1
          fi
          echo "environment_id=${environment_id}" >> "${GITHUB_OUTPUT}"

  detect-migration-changes:
    runs-on: ubuntu-latest
    outputs:
      migration_changed: ${{ steps.detect.outputs.migration_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Detect DB migration changes
        id: detect
        shell: bash
        env:
          GITHUB_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_AFTER_SHA: ${{ github.sha }}
        run: |
          before_sha="${GITHUB_BEFORE_SHA}"
          after_sha="${GITHUB_AFTER_SHA}"

          if [[ -z "${before_sha}" || "${before_sha}" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${after_sha}")"
          else
            changed_files="$(git diff --name-only "${before_sha}" "${after_sha}")"
          fi

          if printf '%s\n' "${changed_files}" | grep -q '^db-migration/'; then
            echo "migration_changed=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "migration_changed=false" >> "${GITHUB_OUTPUT}"

  resolve-migration-contract:
    needs:
      - detect-migration-changes
      - resolve-deploy-target
    if: needs.detect-migration-changes.outputs.migration_changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      database_name: ${{ steps.resolve.outputs.database_name }}
      database_url: ${{ steps.resolve.outputs.database_url }}
      database_username: ${{ steps.resolve.outputs.database_username }}
      database_password_secret_name: ${{ steps.resolve.outputs.database_password_secret_name }}
      tunnel_local_port: ${{ steps.resolve.outputs.tunnel_local_port }}
      tunnel_remote_host: ${{ steps.resolve.outputs.tunnel_remote_host }}
      tunnel_remote_port: ${{ steps.resolve.outputs.tunnel_remote_port }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Resolve DB migration contract
        id: resolve
        shell: bash
        env:
          TARGET_ENVIRONMENT_ID: ${{ needs.resolve-deploy-target.outputs.environment_id }}
        run: |
          ruby - <<'INNER_RUBY'
          require "yaml"
          require "pathname"

          output_path = Pathname.new(ENV.fetch("GITHUB_OUTPUT"))
          workspace = Pathname.new(ENV.fetch("GITHUB_WORKSPACE"))
          model = YAML.load_file(workspace.join("db-migration/db-model.yaml"))

          database = model.fetch("database")
          environment_id = ENV.fetch("TARGET_ENVIRONMENT_ID")
          environment = database.fetch("environments").fetch(environment_id)
          tunnel = environment.fetch("tunnel")

          output_path.open("a") do |handle|
            handle.puts("database_name=#{database.fetch("name")}")
            handle.puts("database_url=#{environment.fetch("url")}")
            handle.puts("database_username=#{environment.fetch("username")}")
            handle.puts("database_password_secret_name=#{environment.fetch("password_secret_name")}")
            handle.puts("tunnel_local_port=#{tunnel.fetch("local_port")}")
            handle.puts("tunnel_remote_host=#{tunnel.fetch("remote_host")}")
            handle.puts("tunnel_remote_port=#{tunnel.fetch("remote_port")}")
          end
          INNER_RUBY

  migrate-db:
    needs:
      - detect-migration-changes
      - resolve-deploy-target
      - resolve-migration-contract
    if: needs.detect-migration-changes.outputs.migration_changed == 'true'
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-target.outputs.environment_id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Execute DB migration
        uses: ./.github/actions/db-migrate-run
        with:
          environment_id: ${{ needs.resolve-deploy-target.outputs.environment_id }}
          database_name: ${{ needs.resolve-migration-contract.outputs.database_name }}
        env:
          FLYWAY_URL: ${{ needs.resolve-migration-contract.outputs.database_url }}
          FLYWAY_USERNAME: ${{ needs.resolve-migration-contract.outputs.database_username }}
          FLYWAY_PASSWORD: ${{ secrets[needs.resolve-migration-contract.outputs.database_password_secret_name] }}
          DEPLOY_VM_HOST: ${{ secrets.DEPLOY_VM_HOST }}
          DEPLOY_VM_USER: ${{ secrets.DEPLOY_VM_USER }}
          DEPLOY_VM_PORT: ${{ vars.DEPLOY_VM_PORT }}
          DEPLOY_VM_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_VM_SSH_PRIVATE_KEY }}
          SSH_TUNNEL_LOCAL_PORT: ${{ needs.resolve-migration-contract.outputs.tunnel_local_port }}
          SSH_TUNNEL_REMOTE_HOST: ${{ needs.resolve-migration-contract.outputs.tunnel_remote_host }}
          SSH_TUNNEL_REMOTE_PORT: ${{ needs.resolve-migration-contract.outputs.tunnel_remote_port }}

  deploy-service:
    needs:
      - detect-migration-changes
      - resolve-deploy-target
      - migrate-db
    if: |
      always() &&
      needs.detect-migration-changes.result == 'success' &&
      needs.resolve-deploy-target.result == 'success' &&
      (
        needs.detect-migration-changes.outputs.migration_changed != 'true' ||
        needs.migrate-db.result == 'success'
      )
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-deploy-target.outputs.environment_id }}
    permissions:
      contents: read
      packages: write
    env:
      DEPLOY_VM_PORT: ${{ vars.DEPLOY_VM_PORT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Execute deployment
        uses: ./.github/actions/service-deploy-run
        with:
          github_environment: ${{ needs.resolve-deploy-target.outputs.environment_id }}
        env:
          DEPLOY_VM_HOST: ${{ secrets.DEPLOY_VM_HOST }}
          DEPLOY_VM_USER: ${{ secrets.DEPLOY_VM_USER }}
          DEPLOY_VM_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_VM_SSH_PRIVATE_KEY }}
          GHCR_PULL_USERNAME: ${{ secrets.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          MAVEN_REPOSITORY_USERNAME: ${{ vars.MAVEN_REPOSITORY_USERNAME }}
          MAVEN_REPOSITORY_TOKEN: ${{ secrets.MAVEN_REPOSITORY_TOKEN }}
          ATMS_SOX_DB_PASSWORD: ${{ secrets.ATMS_SOX_DB_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_ORG_ID: ${{ vars.OPENAI_ORG_ID }}
          OPENAI_PROJECT_ID: ${{ vars.OPENAI_PROJECT_ID }}
