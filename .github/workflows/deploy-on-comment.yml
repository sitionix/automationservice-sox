name: Deploy Comment Router

on:
  issue_comment:
    types:
      - created

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.route.outputs.enabled }}
      target_type: ${{ steps.route.outputs.target_type }}
      environment_id: ${{ steps.route.outputs.environment_id }}
      summary: ${{ steps.route.outputs.summary }}
      is_pull_request: ${{ steps.route.outputs.is_pull_request }}
      pr_head_ref: ${{ steps.pr.outputs.head_ref || steps.develop.outputs.head_ref }}
      checkout_ref: ${{ steps.pr.outputs.head_sha || steps.develop.outputs.head_sha }}
      same_repo: ${{ steps.pr.outputs.same_repo || 'true' }}
    steps:
      - name: Read pull request metadata
        id: pr
        if: github.event.issue.pull_request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            core.setOutput("head_ref", pr.data.head.ref);
            core.setOutput("head_sha", pr.data.head.sha);
            core.setOutput(
              "same_repo",
              pr.data.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}` ? "true" : "false"
            );

      - name: Read develop metadata for issue commands
        id: develop
        if: ${{ !github.event.issue.pull_request }}
        uses: actions/github-script@v7
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "develop",
            });
            core.setOutput("head_ref", "develop");
            core.setOutput("head_sha", branch.data.commit.sha);

      - name: Route comment command
        id: route
        shell: bash
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          IS_PULL_REQUEST: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: |
          ruby - <<'INNER_RUBY'
          require "pathname"
          require "shellwords"

          output_path = Pathname.new(ENV.fetch("GITHUB_OUTPUT"))

          def emit(output_path, key, value)
            output_path.open("a") do |handle|
              handle.puts("#{key}=#{value}")
            end
          end

          first_non_empty_line = ENV.fetch("COMMENT_BODY", "").each_line.map(&:strip).find { |line| !line.empty? }
          if first_non_empty_line.nil?
            emit(output_path, "enabled", "false")
            emit(output_path, "target_type", "")
            emit(output_path, "environment_id", "")
            emit(output_path, "summary", "")
            emit(output_path, "is_pull_request", ENV.fetch("IS_PULL_REQUEST"))
            exit 0
          end

          begin
            tokens = Shellwords.split(first_non_empty_line)
          rescue ArgumentError => error
            abort("Malformed deployment comment: #{error.message}")
          end

          is_pull_request = ENV.fetch("IS_PULL_REQUEST") == "true"

          if tokens[0] == "/deploy"
            unless is_pull_request
              emit(output_path, "enabled", "false")
              emit(output_path, "target_type", "")
              emit(output_path, "environment_id", "")
              emit(output_path, "summary", "")
              emit(output_path, "is_pull_request", "false")
              exit 0
            end

            target_type = tokens[1].to_s
            unless %w[db service].include?(target_type)
              emit(output_path, "enabled", "false")
              emit(output_path, "target_type", "")
              emit(output_path, "environment_id", "")
              emit(output_path, "summary", "")
              emit(output_path, "is_pull_request", "true")
              exit 0
            end

            emit(output_path, "enabled", "true")
            emit(output_path, "target_type", target_type)
            emit(output_path, "environment_id", "")
            emit(output_path, "summary", "")
            emit(output_path, "is_pull_request", "true")
            exit 0
          end

          if tokens[0] == "/refresh" && tokens[1].to_s == "scope"
            options = {}
            cursor = 2
            while cursor < tokens.length
              token = tokens[cursor]
              case token
              when "--env"
                cursor += 1
                options["env"] = tokens[cursor]
              else
                abort("Unsupported /refresh scope option: #{token}")
              end
              cursor += 1
            end

            environment_id = options["env"].to_s.strip
            environment_id = "dev" if environment_id.empty?

            emit(output_path, "enabled", "true")
            emit(output_path, "target_type", "refresh_scope")
            emit(output_path, "environment_id", environment_id)
            emit(output_path, "summary", "automationservice-sox scope refresh -> #{environment_id}")
            emit(output_path, "is_pull_request", is_pull_request ? "true" : "false")
            exit 0
          end

          emit(output_path, "enabled", "false")
          emit(output_path, "target_type", "")
          emit(output_path, "environment_id", "")
          emit(output_path, "summary", "")
          emit(output_path, "is_pull_request", is_pull_request ? "true" : "false")
          INNER_RUBY

  reject-fork:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.is_pull_request == 'true' && needs.prepare.outputs.same_repo != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject fork-based comment deploy runs
        run: |
          echo "PR comment deploys are allowed only for branches in this repository." >&2
          exit 1

  resolve-db:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.target_type == 'db' && needs.prepare.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.resolve_target.outputs.enabled }}
      environment_id: ${{ steps.resolve_target.outputs.environment_id }}
      summary: ${{ steps.resolve_target.outputs.summary }}
      database_name: ${{ steps.resolve_target.outputs.database_name }}
      database_url: ${{ steps.resolve_target.outputs.database_url }}
      database_username: ${{ steps.resolve_target.outputs.database_username }}
      database_password_secret_name: ${{ steps.resolve_target.outputs.database_password_secret_name }}
      tunnel_local_port: ${{ steps.resolve_target.outputs.tunnel_local_port }}
      tunnel_remote_host: ${{ steps.resolve_target.outputs.tunnel_remote_host }}
      tunnel_remote_port: ${{ steps.resolve_target.outputs.tunnel_remote_port }}
    steps:
      - name: Checkout pull request head for DB config resolution
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Resolve DB migration target
        id: resolve_target
        uses: ./.github/actions/db-migrate-resolve
        with:
          comment_body: ${{ github.event.comment.body }}
          is_pull_request: "true"

  resolve-service:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.target_type == 'service' && needs.prepare.outputs.same_repo == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.resolve_target.outputs.enabled }}
      environment_id: ${{ steps.resolve_target.outputs.environment_id }}
      summary: ${{ steps.resolve_target.outputs.summary }}
    steps:
      - name: Checkout pull request head for service deploy resolution
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.checkout_ref }}

      - name: Resolve service deploy target
        id: resolve_target
        uses: ./.github/actions/service-deploy-resolve
        with:
          comment_body: ${{ github.event.comment.body }}
          is_pull_request: "true"

  dispatch-db-migrate:
    needs:
      - prepare
      - resolve-db
    if: needs.resolve-db.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dispatch DB migrate workflow
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          TARGET_SUMMARY: ${{ needs.resolve-db.outputs.summary }}
          PR_HEAD_REF: ${{ needs.prepare.outputs.pr_head_ref }}
          CHECKOUT_REF: ${{ needs.prepare.outputs.checkout_ref }}
          ENVIRONMENT_ID: ${{ needs.resolve-db.outputs.environment_id }}
          DATABASE_NAME: ${{ needs.resolve-db.outputs.database_name }}
          DATABASE_URL: ${{ needs.resolve-db.outputs.database_url }}
          DATABASE_USERNAME: ${{ needs.resolve-db.outputs.database_username }}
          DATABASE_PASSWORD_SECRET_NAME: ${{ needs.resolve-db.outputs.database_password_secret_name }}
          TUNNEL_LOCAL_PORT: ${{ needs.resolve-db.outputs.tunnel_local_port }}
          TUNNEL_REMOTE_HOST: ${{ needs.resolve-db.outputs.tunnel_remote_host }}
          TUNNEL_REMOTE_PORT: ${{ needs.resolve-db.outputs.tunnel_remote_port }}
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "db-migrate-command",
              client_payload: {
                prNumber: Number(process.env.PR_NUMBER),
                targetSummary: process.env.TARGET_SUMMARY,
                prHeadRef: process.env.PR_HEAD_REF,
                checkoutRef: process.env.CHECKOUT_REF,
                environmentId: process.env.ENVIRONMENT_ID,
                databaseName: process.env.DATABASE_NAME,
                databaseUrl: process.env.DATABASE_URL,
                databaseUsername: process.env.DATABASE_USERNAME,
                databasePasswordSecretName: process.env.DATABASE_PASSWORD_SECRET_NAME,
                tunnelLocalPort: process.env.TUNNEL_LOCAL_PORT,
                tunnelRemoteHost: process.env.TUNNEL_REMOTE_HOST,
                tunnelRemotePort: process.env.TUNNEL_REMOTE_PORT,
              },
            });

  dispatch-service-deploy:
    needs:
      - prepare
      - resolve-service
    if: needs.resolve-service.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dispatch service deploy workflow
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          TARGET_SUMMARY: ${{ needs.resolve-service.outputs.summary }}
          PR_HEAD_REF: ${{ needs.prepare.outputs.pr_head_ref }}
          CHECKOUT_REF: ${{ needs.prepare.outputs.checkout_ref }}
          ENVIRONMENT_ID: ${{ needs.resolve-service.outputs.environment_id }}
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "service-deploy-command",
              client_payload: {
                prNumber: Number(process.env.PR_NUMBER),
                targetSummary: process.env.TARGET_SUMMARY,
                prHeadRef: process.env.PR_HEAD_REF,
                checkoutRef: process.env.CHECKOUT_REF,
                environmentId: process.env.ENVIRONMENT_ID,
              },
            });

  dispatch-refresh-scope:
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.target_type == 'refresh_scope'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Dispatch scope refresh workflow
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TARGET_SUMMARY: ${{ needs.prepare.outputs.summary }}
          SOURCE_REF: ${{ needs.prepare.outputs.pr_head_ref }}
          CHECKOUT_REF: ${{ needs.prepare.outputs.checkout_ref }}
          ENVIRONMENT_ID: ${{ needs.prepare.outputs.environment_id }}
          IS_PULL_REQUEST: ${{ needs.prepare.outputs.is_pull_request }}
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: "service-deploy-command",
              client_payload: {
                issueNumber: Number(process.env.ISSUE_NUMBER),
                commentTargetType: process.env.IS_PULL_REQUEST === "true" ? "pr" : "issue",
                targetSummary: process.env.TARGET_SUMMARY,
                prHeadRef: process.env.SOURCE_REF,
                checkoutRef: process.env.CHECKOUT_REF,
                environmentId: process.env.ENVIRONMENT_ID,
              },
            });
